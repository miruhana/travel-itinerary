<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程と精算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EAEE;
    --card:#FFFFFF;
    --ink:#222831;
    --ink-soft:#5E6773;
    --ink-faint:#9AA2AC;
    --line:#D4D9E0;
    --pine:#233A55;
    --pine-soft:#DEE4EC;
    --amber:#5C7391;
    --amber-soft:#E4E9F0;
    --rust:#6B7686;
    --rust-soft:#E6E8EC;
    --radius-sm:6px;
    --radius-md:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans JP',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:0 18px 60px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .serif{font-family:'Shippori Mincho',serif;}

  /* ---------- Header / hero ---------- */
  .hero{
    position:relative;
    padding:34px 4px 22px;
    overflow:hidden;
  }
  .hero-route{position:absolute;inset:0;width:100%;height:100%;opacity:0.55;pointer-events:none;}
  .hero-inner{position:relative;z-index:1;}
  .trip-name{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:32px;
    letter-spacing:0.02em;
    margin:0;
    line-height:1.3;
    border:none;background:transparent;color:var(--ink);
    width:100%;
    padding:2px 0;
    outline:none;
  }
  .trip-name:focus{border-bottom:1px dashed var(--amber);}
  .trip-sub{
    margin-top:6px;
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .trip-sub b.mono{color:var(--ink);font-weight:600;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    margin-top:8px;
    gap:2px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:12px 6px 11px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    display:flex;align-items:center;justify-content:center;gap:6px;
    user-select:none;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--amber);}
  .tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;}

  .panel{padding-top:22px;}

  /* ---------- Day selector ---------- */
  .day-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
  .day-row::-webkit-scrollbar{height:5px;}
  .day-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .day-chip{
    flex:0 0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:9px 14px;
    cursor:pointer;
    text-align:left;
    position:relative;
  }
  .day-chip.active{border-color:var(--pine);background:var(--pine-soft);}
  .day-chip .dlabel{font-size:11px;color:var(--ink-soft);letter-spacing:0.03em;}
  .day-chip .ddate{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--ink);}
  .day-chip.active .ddate{color:var(--pine);}
  .day-add{
    flex:0 0 auto;
    border:1px dashed var(--ink-faint);
    border-radius:var(--radius-sm);
    padding:9px 16px;
    color:var(--ink-soft);
    cursor:pointer;
    background:transparent;
    font-size:20px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Timeline ---------- */
  .timeline{position:relative;padding-left:64px;}
  .timeline::before{
    content:"";position:absolute;left:44px;top:6px;bottom:6px;width:1px;
    background:repeating-linear-gradient(to bottom, var(--line) 0 5px, transparent 5px 10px);
  }
  .event{position:relative;margin-bottom:18px;}
  .event-time{
    position:absolute;left:-64px;top:2px;width:56px;text-align:right;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--amber);
  }
  .event-dot{
    position:absolute;left:-25px;top:6px;width:11px;height:11px;border-radius:50%;
    background:var(--paper);border:2px solid var(--pine);
  }
  .event-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:13px 15px;
  }
  .event-top{display:flex;align-items:flex-start;gap:9px;}
  .event-icon{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--pine-soft);
    display:flex;align-items:center;justify-content:center;color:var(--pine);
  }
  .event-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .event-title{font-size:15.5px;font-weight:600;color:var(--ink);}
  .event-note{margin-top:3px;font-size:13px;color:var(--ink-soft);line-height:1.5;white-space:pre-wrap;}
  .event-del{
    margin-left:auto;background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:2px 4px;
  }
  .event-del:hover{color:var(--rust);}

  .empty{
    color:var(--ink-soft);font-size:13.5px;padding:26px 4px;text-align:center;
    border:1px dashed var(--line);border-radius:var(--radius-md);background:var(--card);
  }

  /* ---------- Buttons / forms ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-sm);
    padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.pine{background:var(--pine);}
  .btn.rust{background:var(--rust);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn:active{transform:translateY(1px);}
  .add-trigger{
    display:flex;align-items:center;gap:6px;color:var(--pine);font-weight:600;font-size:13.5px;
    cursor:pointer;padding:10px 2px;
  }
  .add-trigger svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;}

  .form-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px;margin-bottom:16px;
  }
  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .form-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
  .form-field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .form-field input, .form-field select, .form-field textarea{
    font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--radius-sm);background:#fff;color:var(--ink);outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{border-color:var(--pine);}
  .form-field textarea{resize:vertical;min-height:44px;}
  .form-actions{display:flex;gap:8px;margin-top:4px;}

  .icon-pick{display:flex;gap:6px;flex-wrap:wrap;}
  .icon-opt{
    width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-opt svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .icon-opt.sel{border-color:var(--pine);background:var(--pine-soft);color:var(--pine);}

  /* ---------- Members ---------- */
  .member-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .member-row{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:10px 12px;
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;color:#fff;font-weight:600;font-size:13.5px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .member-name{font-size:14.5px;font-weight:500;flex:1;}
  .member-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;}
  .member-del:hover{color:var(--rust);}

  /* ---------- Settlement ---------- */
  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:0.02em;margin:24px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .expense-row{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px 13px;margin-bottom:8px;
  }
  .expense-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .expense-desc{font-size:14.5px;font-weight:600;}
  .expense-amount{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--rust);white-space:nowrap;}
  .expense-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .expense-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;margin-left:6px;}
  .expense-del:hover{color:var(--rust);}

  .balance-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .balance-row{display:flex;align-items:center;gap:10px;}
  .balance-name{width:84px;font-size:13.5px;font-weight:500;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .balance-bar-track{flex:1;height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden;}
  .balance-bar{position:absolute;top:0;bottom:0;border-radius:4px;}
  .balance-val{width:96px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;flex:0 0 auto;}

  .settle-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .settle-row{
    display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid var(--amber);
    border-radius:var(--radius-sm);padding:11px 13px;
  }
  .settle-arrow{color:var(--amber);flex:0 0 auto;}
  .settle-arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .settle-text{font-size:14px;flex:1;}
  .settle-text b{font-weight:700;}
  .settle-amount{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14.5px;color:var(--ink);}

  .check-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .check-pill{
    display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;
    padding:5px 10px 5px 6px;font-size:12.5px;cursor:pointer;background:#fff;
  }
  .check-pill.sel{border-color:var(--pine);background:var(--pine-soft);}
  .check-pill .dot{width:16px;height:16px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}

  .note-banner{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:26px;line-height:1.6;}

  @media (max-width:480px){
    .trip-name{font-size:26px;}
    .timeline{padding-left:56px;}
    .event-time{left:-56px;width:48px;font-size:12.5px;}
    .balance-name{width:64px;}
    .balance-val{width:78px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  plane: '<polygon points="2,13 22,4 13,13 22,21"/>',
  train: '<rect x="5" y="3" width="14" height="13" rx="4"/><line x1="5" y1="10" x2="19" y2="10"/><circle cx="8.5" cy="19" r="1.4"/><circle cx="15.5" cy="19" r="1.4"/>',
  bus: '<rect x="3" y="5" width="18" height="11" rx="2.5"/><line x1="3" y1="11" x2="21" y2="11"/><circle cx="7" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  car: '<path d="M4 16 L5.5 9.5 Q6.3 8 8 8 H16 Q17.7 8 18.5 9.5 L20 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="20" r="1.4"/><circle cx="16.5" cy="20" r="1.4"/>',
  walk: '<circle cx="13" cy="4.5" r="1.8"/><line x1="12.5" y1="7" x2="11.5" y2="14"/><line x1="11.5" y1="14" x2="8" y2="20"/><line x1="11.5" y1="14" x2="16" y2="19"/><line x1="9" y1="10" x2="15" y2="9"/>',
  ship: '<path d="M4 15 L20 15 L18 20 L6 20 Z"/><line x1="11" y1="15" x2="11" y2="3"/><path d="M11 4 L17 9 L11 9 Z"/>',
  pin: '<path d="M12 21 C12 21 5 13.5 5 9 a7 7 0 0 1 14 0 c0 4.5 -7 12 -7 12 Z"/><circle cx="12" cy="9" r="2.3"/>'
};
const ICON_ORDER = ['pin','walk','train','bus','car','plane','ship'];
const ICON_LABEL = {pin:'一般',walk:'徒歩',train:'電車',bus:'バス',car:'車',plane:'飛行機',ship:'船'};

const TAB_ICONS = {
  itinerary:'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/>',
  members:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 14.3c2.6.4 4.5 2.6 4.5 5.7"/>',
  settlement:'<line x1="4" y1="7" x2="16" y2="7"/><path d="M16 7 L12 3 M16 7 L12 11"/><line x1="20" y1="17" x2="8" y2="17"/><path d="M8 17 L12 13 M8 17 L12 21"/>'
};

const PALETTE = ['#233A55','#5C7391','#6B7686','#37506B','#8C97A6','#42586F','#7A8AA0','#4B5B6E'];
const WEEKDAY = ['日','月','火','水','木','金','土'];

let state = {
  tripName: '新しい旅行',
  members: [],
  itinerary: [],   // [{id, date, label, events:[{id,time,title,note,icon}]}]
  expenses: [],    // [{id, desc, amount, payer, participants:[ids], date}]
  activeTab: 'itinerary',
  activeDay: null,
  ui: { addingDay:false, addingEventFor:null, addingMember:false, addingExpense:false, eventIcon:'pin' }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function memberColor(id){
  const idx = state.members.findIndex(m => m.id === id);
  return PALETTE[idx >= 0 ? idx % PALETTE.length : 0];
}
function memberName(id){
  const m = state.members.find(m => m.id === id);
  return m ? m.name : '(削除済み)';
}

/* ---------------- storage ---------------- */
async function loadAll(){
  try{ const r = await window.storage.get('trip-meta', true); if(r) state.tripName = JSON.parse(r.value).name || state.tripName; }catch(e){}
  try{ const r = await window.storage.get('members', true); if(r) state.members = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('itinerary', true); if(r) state.itinerary = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('expenses', true); if(r) state.expenses = JSON.parse(r.value); }catch(e){}
  if(state.itinerary.length) state.activeDay = state.itinerary[0].id;
  render();
}
async function saveMeta(){ try{ await window.storage.set('trip-meta', JSON.stringify({name: state.tripName}), true); }catch(e){} }
async function saveMembers(){ try{ await window.storage.set('members', JSON.stringify(state.members), true); }catch(e){} }
async function saveItinerary(){ try{ await window.storage.set('itinerary', JSON.stringify(state.itinerary), true); }catch(e){} }
async function saveExpenses(){ try{ await window.storage.set('expenses', JSON.stringify(state.expenses), true); }catch(e){} }

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHero()}
    ${renderTabs()}
    <div class="panel">
      ${state.activeTab === 'itinerary' ? renderItinerary() : ''}
      ${state.activeTab === 'members' ? renderMembers() : ''}
      ${state.activeTab === 'settlement' ? renderSettlement() : ''}
    </div>
    <div class="note-banner">この旅程と精算はメンバー間で共有されます。<br>誰かが編集すると、内容は全員に共通で反映されます。</div>
  `;
  attachEvents();
}

function renderHero(){
  return `
  <div class="hero">
    <svg class="hero-route" viewBox="0 0 700 70" preserveAspectRatio="none">
      <path d="M0,50 C120,10 220,60 340,25 C460,-5 540,45 700,15" fill="none" stroke="#233A55" stroke-width="1.4" stroke-dasharray="1 9" stroke-linecap="round"/>
      <circle cx="0" cy="50" r="3.5" fill="#233A55"/>
      <circle cx="230" cy="45" r="3.5" fill="#5C7391"/>
      <circle cx="460" cy="12" r="3.5" fill="#233A55"/>
      <g transform="translate(672,10) rotate(20)">
        <polygon points="0,7 26,0 14,7 26,14" fill="#5C7391"/>
      </g>
    </svg>
    <div class="hero-inner">
      <input class="trip-name serif" id="tripNameInput" value="${esc(state.tripName)}" spellcheck="false">
      <div class="trip-sub">
        <span>旅程日数 <b class="mono">${state.itinerary.length}</b> 日</span>
        <span>メンバー <b class="mono">${state.members.length}</b> 人</span>
        <span>精算件数 <b class="mono">${state.expenses.length}</b> 件</span>
      </div>
    </div>
  </div>`;
}

function renderTabs(){
  const tabs = [['itinerary','旅程'],['members','メンバー'],['settlement','精算']];
  return `<div class="tabs">${tabs.map(([key,label]) => `
    <div class="tab ${state.activeTab===key?'active':''}" data-action="tab" data-tab="${key}">
      <svg viewBox="0 0 24 24">${TAB_ICONS[key]}</svg>${label}
    </div>`).join('')}</div>`;
}

/* ---- itinerary ---- */
function renderItinerary(){
  const days = state.itinerary;
  const dayRow = `
    <div class="day-row">
      ${days.map(d => {
        const dt = new Date(d.date+'T00:00:00');
        const valid = !isNaN(dt);
        return `<div class="day-chip ${d.id===state.activeDay?'active':''}" data-action="pick-day" data-id="${d.id}">
          <div class="dlabel">${esc(d.label||'')}</div>
          <div class="ddate">${valid ? (dt.getMonth()+1)+'/'+dt.getDate()+'('+WEEKDAY[dt.getDay()]+')' : esc(d.date)}</div>
        </div>`;
      }).join('')}
      <div class="day-add" data-action="toggle-add-day">＋</div>
    </div>`;

  const addDayForm = state.ui.addingDay ? `
    <div class="form-card">
      <div class="form-row">
        <div class="form-field"><label>日付</label><input type="date" id="newDayDate"></div>
        <div class="form-field"><label>ラベル（任意）</label><input type="text" id="newDayLabel" placeholder="例）出発日"></div>
      </div>
      <div class="form-actions">
        <button class="btn pine" data-action="add-day">この日を追加</button>
        <button class="btn ghost" data-action="cancel-add-day">キャンセル</button>
      </div>
    </div>` : '';

  const day = days.find(d => d.id === state.activeDay);
  let body;
  if(!days.length){
    body = `<div class="empty">まだ日程がありません。「＋」から旅行の日を追加してください。</div>`;
  } else if(!day){
    body = `<div class="empty">日を選んでください。</div>`;
  } else {
    const events = [...day.events].sort((a,b)=> a.time.localeCompare(b.time));
    body = `
      <div class="timeline">
        ${events.length ? events.map(ev => `
          <div class="event">
            <div class="event-time mono">${esc(ev.time)}</div>
            <div class="event-dot"></div>
            <div class="event-card">
              <div class="event-top">
                <div class="event-icon"><svg viewBox="0 0 24 24">${ICONS[ev.icon]||ICONS.pin}</svg></div>
                <div style="flex:1;">
                  <div class="event-title">${esc(ev.title)}</div>
                  ${ev.note ? `<div class="event-note">${esc(ev.note)}</div>` : ''}
                </div>
                <button class="event-del" data-action="del-event" data-day="${day.id}" data-id="${ev.id}">✕</button>
              </div>
            </div>
          </div>`).join('') : '<div class="empty" style="margin-left:-64px;">この日の予定はまだありません。</div>'}
      </div>
      ${state.ui.addingEventFor === day.id ? renderEventForm() : `
        <div class="add-trigger" data-action="toggle-add-event" data-day="${day.id}">
          <svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
          予定を追加
        </div>`}
    `;
  }
  return dayRow + addDayForm + body;
}

function renderEventForm(){
  return `
  <div class="form-card">
    <div class="form-row">
      <div class="form-field" style="max-width:110px;"><label>時刻</label><input type="time" id="newEventTime" value="09:00"></div>
      <div class="form-field" style="flex:2;"><label>場所・内容</label><input type="text" id="newEventTitle" placeholder="例）浅草寺"></div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>アイコン</label>
        <div class="icon-pick">
          ${ICON_ORDER.map(k => `<div class="icon-opt ${state.ui.eventIcon===k?'sel':''}" data-action="pick-icon" data-icon="${k}" title="${ICON_LABEL[k]}">
            <svg viewBox="0 0 24 24">${ICONS[k]}</svg>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>メモ（任意）</label><textarea id="newEventNote" placeholder="行き方、予約番号など"></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn pine" data-action="add-event">追加する</button>
      <button class="btn ghost" data-action="cancel-add-event">キャンセル</button>
    </div>
  </div>`;
}

/* ---- members ---- */
function renderMembers(){
  const list = state.members.length ? `
    <div class="member-list">
      ${state.members.map(m => `
        <div class="member-row">
          <div class="avatar" style="background:${memberColor(m.id)}">${esc(m.name.slice(0,1))}</div>
          <div class="member-name">${esc(m.name)}</div>
          <button class="member-del" data-action="del-member" data-id="${m.id}">✕</button>
        </div>`).join('')}
    </div>` : `<div class="empty">まだメンバーがいません。旅行に参加する人を追加しましょう。</div>`;

  const form = state.ui.addingMember ? `
    <div class="form-card">
      <div class="form-row">
        <div class="form-field"><label>名前</label><input type="text" id="newMemberName" placeholder="例）田中"></div>
      </div>
      <div class="form-actions">
        <button class="btn pine" data-action="add-member">追加する</button>
        <button class="btn ghost" data-action="cancel-add-member">キャンセル</button>
      </div>
    </div>` : `
    <div class="add-trigger" data-action="toggle-add-member">
      <svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
      メンバーを追加
    </div>`;

  return list + form;
}

/* ---- settlement ---- */
function computeBalances(){
  const bal = {};
  state.members.forEach(m => bal[m.id] = 0);
  state.expenses.forEach(ex => {
    const parts = ex.participants.filter(id => bal.hasOwnProperty(id));
    if(!parts.length) return;
    const share = ex.amount / parts.length;
    if(bal.hasOwnProperty(ex.payer)) bal[ex.payer] += ex.amount;
    parts.forEach(id => bal[id] -= share);
  });
  return bal;
}
function simplifyDebts(bal){
  const creditors = [], debtors = [];
  Object.entries(bal).forEach(([id,amt]) => {
    if(amt > 0.5) creditors.push({id, amt});
    else if(amt < -0.5) debtors.push({id, amt});
  });
  creditors.sort((a,b)=> b.amt - a.amt);
  debtors.sort((a,b)=> a.amt - b.amt);
  const tx = [];
  let i=0, j=0;
  while(i < debtors.length && j < creditors.length){
    const d = debtors[i], c = creditors[j];
    const amt = Math.min(-d.amt, c.amt);
    tx.push({from:d.id, to:c.id, amount:amt});
    d.amt += amt; c.amt -= amt;
    if(Math.abs(d.amt) < 0.5) i++;
    if(Math.abs(c.amt) < 0.5) j++;
  }
  return tx;
}

function renderSettlement(){
  const form = state.ui.addingExpense ? renderExpenseForm() : `
    <div class="add-trigger" data-action="toggle-add-expense">
      <svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
      支払いを記録
    </div>`;

  const expenses = [...state.expenses].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const expenseList = expenses.length ? expenses.map(ex => `
    <div class="expense-row">
      <div class="expense-top">
        <div>
          <div class="expense-desc">${esc(ex.desc)}</div>
          <div class="expense-meta">${esc(memberName(ex.payer))} が支払い ・ ${ex.participants.length}人で割り勘</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="expense-amount mono">${yen(ex.amount)}</div>
          <button class="expense-del" data-action="del-expense" data-id="${ex.id}">✕</button>
        </div>
      </div>
    </div>`).join('') : '<div class="empty">まだ記録がありません。</div>';

  let balanceSection = '', settleSection = '';
  if(state.members.length){
    const bal = computeBalances();
    const maxAbs = Math.max(1, ...Object.values(bal).map(v => Math.abs(v)));
    balanceSection = `
      <div class="balance-grid">
        ${state.members.map(m => {
          const v = bal[m.id] || 0;
          const pct = Math.min(100, Math.abs(v) / maxAbs * 100);
          const positive = v >= 0;
          return `<div class="balance-row">
            <div class="balance-name">${esc(m.name)}</div>
            <div class="balance-bar-track">
              <div class="balance-bar" style="width:${pct}%; ${positive ? 'left:50%;' : 'right:50%;'} background:${positive ? 'var(--pine)' : 'var(--rust)'}"></div>
            </div>
            <div class="balance-val" style="color:${positive ? 'var(--pine)' : 'var(--rust)'}">${positive?'+':''}${yen(v)}</div>
          </div>`;
        }).join('')}
      </div>`;

    const tx = simplifyDebts(bal);
    settleSection = tx.length ? `
      <div class="settle-list">
        ${tx.map(t => `
          <div class="settle-row">
            <div class="settle-text"><b>${esc(memberName(t.from))}</b> が <b>${esc(memberName(t.to))}</b> に支払う</div>
            <div class="settle-amount mono">${yen(t.amount)}</div>
          </div>`).join('')}
      </div>` : `<div class="empty">現在、清算の必要はありません。</div>`;
  } else {
    balanceSection = `<div class="empty">メンバーを追加すると集計が表示されます。</div>`;
  }

  return `
    <div class="section-title">支払いの記録</div>
    ${form}
    ${expenseList}
    <div class="section-title">現在の収支</div>
    ${balanceSection}
    <div class="section-title">最終清算（誰が誰にいくら払うか）</div>
    ${settleSection}
  `;
}

function renderExpenseForm(){
  if(!state.members.length){
    return `<div class="form-card">先に「メンバー」タブから旅行メンバーを追加してください。</div>`;
  }
  const sel = state.ui.expenseParticipants || state.members.map(m => m.id);
  return `
  <div class="form-card">
    <div class="form-row">
      <div class="form-field" style="flex:2;"><label>内容</label><input type="text" id="newExpDesc" placeholder="例）新幹線チケット"></div>
      <div class="form-field"><label>金額（円）</label><input type="number" id="newExpAmount" min="0" placeholder="12000"></div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>支払った人</label>
        <select id="newExpPayer">
          ${state.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}
        </select>
      </div>
      <div class="form-field"><label>日付（任意）</label><input type="date" id="newExpDate"></div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>割り勘するメンバー</label>
        <div class="check-grid">
          ${state.members.map(m => `
            <div class="check-pill ${sel.includes(m.id)?'sel':''}" data-action="toggle-participant" data-id="${m.id}">
              <div class="dot" style="background:${memberColor(m.id)}">${esc(m.name.slice(0,1))}</div>${esc(m.name)}
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn rust" data-action="add-expense">記録する</button>
      <button class="btn ghost" data-action="cancel-add-expense">キャンセル</button>
    </div>
  </div>`;
}

/* ---------------- events ---------------- */
function attachEvents(){
  const app = document.getElementById('app');

  const nameInput = document.getElementById('tripNameInput');
  if(nameInput){
    nameInput.addEventListener('change', () => {
      state.tripName = nameInput.value.trim() || '新しい旅行';
      saveMeta();
    });
  }

  app.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action === 'tab'){ state.activeTab = el.dataset.tab; render(); return; }
    if(action === 'pick-day'){ state.activeDay = el.dataset.id; state.ui.addingEventFor = null; render(); return; }

    if(action === 'toggle-add-day'){ state.ui.addingDay = !state.ui.addingDay; render(); return; }
    if(action === 'cancel-add-day'){ state.ui.addingDay = false; render(); return; }
    if(action === 'add-day'){
      const date = document.getElementById('newDayDate').value;
      const label = document.getElementById('newDayLabel').value.trim();
      if(!date){ return; }
      const d = { id: uid(), date, label, events: [] };
      state.itinerary.push(d);
      state.itinerary.sort((a,b) => a.date.localeCompare(b.date));
      state.activeDay = d.id;
      state.ui.addingDay = false;
      await saveItinerary();
      render();
      return;
    }

    if(action === 'toggle-add-event'){
      state.ui.addingEventFor = state.ui.addingEventFor === el.dataset.day ? null : el.dataset.day;
      state.ui.eventIcon = 'pin';
      render();
      return;
    }
    if(action === 'cancel-add-event'){ state.ui.addingEventFor = null; render(); return; }
    if(action === 'pick-icon'){ state.ui.eventIcon = el.dataset.icon; render(); return; }
    if(action === 'add-event'){
      const day = state.itinerary.find(d => d.id === state.ui.addingEventFor);
      if(!day) return;
      const time = document.getElementById('newEventTime').value || '00:00';
      const title = document.getElementById('newEventTitle').value.trim();
      const note = document.getElementById('newEventNote').value.trim();
      if(!title) return;
      day.events.push({ id: uid(), time, title, note, icon: state.ui.eventIcon });
      state.ui.addingEventFor = null;
      await saveItinerary();
      render();
      return;
    }
    if(action === 'del-event'){
      const day = state.itinerary.find(d => d.id === el.dataset.day);
      if(!day) return;
      day.events = day.events.filter(ev => ev.id !== el.dataset.id);
      await saveItinerary();
      render();
      return;
    }

    if(action === 'toggle-add-member'){ state.ui.addingMember = true; render(); document.getElementById('newMemberName').focus(); return; }
    if(action === 'cancel-add-member'){ state.ui.addingMember = false; render(); return; }
    if(action === 'add-member'){
      const input = document.getElementById('newMemberName');
      const name = input.value.trim();
      if(!name) return;
      state.members.push({ id: uid(), name });
      state.ui.addingMember = false;
      await saveMembers();
      render();
      return;
    }
    if(action === 'del-member'){
      state.members = state.members.filter(m => m.id !== el.dataset.id);
      await saveMembers();
      render();
      return;
    }

    if(action === 'toggle-add-expense'){
      state.ui.addingExpense = true;
      state.ui.expenseParticipants = state.members.map(m => m.id);
      render();
      return;
    }
    if(action === 'cancel-add-expense'){ state.ui.addingExpense = false; render(); return; }
    if(action === 'toggle-participant'){
      const id = el.dataset.id;
      const cur = state.ui.expenseParticipants || state.members.map(m => m.id);
      state.ui.expenseParticipants = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
      render();
      return;
    }
    if(action === 'add-expense'){
      const desc = document.getElementById('newExpDesc').value.trim();
      const amount = parseFloat(document.getElementById('newExpAmount').value);
      const payer = document.getElementById('newExpPayer').value;
      const date = document.getElementById('newExpDate').value;
      const participants = state.ui.expenseParticipants || [];
      if(!desc || !amount || amount <= 0 || !participants.length) return;
      state.expenses.push({ id: uid(), desc, amount, payer, participants, date });
      state.ui.addingExpense = false;
      await saveExpenses();
      render();
      return;
    }
    if(action === 'del-expense'){
      state.expenses = state.expenses.filter(ex => ex.id !== el.dataset.id);
      await saveExpenses();
      render();
      return;
    }
  });
}

loadAll();
</script>
